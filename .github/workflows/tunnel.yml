name: Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y openssh-client wget

      - name: Download chisel
        run: |
          wget https://github.com/jpillora/chisel/releases/download/v1.9.1/chisel_1.9.1_linux_amd64.gz
          gunzip chisel_1.9.1_linux_amd64.gz
          chmod +x chisel_1.9.1_linux_amd64
          sudo mv chisel_1.9.1_linux_amd64 /usr/local/bin/chisel

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Connect to Hetzner & create SOCKS
        run: |
          ssh -o StrictHostKeyChecking=no -N -D 127.0.0.1:1080 root@91.107.133.36 &
      
      - name: Start chisel server (Public entry)
        run: |
          chisel server --port 443 --reverse
